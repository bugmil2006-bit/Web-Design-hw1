<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Milan</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
        <h1>Project AI Assistant</h1>
    </header>
    <main id="main-content">
        <section class="chat-interface">
            <div id="chat-window" class="chat-window">
                <div class="message bot-message">Hello! Ask me about C algorithms or the dirt park project.</div>
            </div>
            
            <form id="chat-form" class="chat-form">
                <label for="user-input" class="visually-hidden">Type your question</label>
                <input type="text" id="user-input" placeholder="e.g., How fast is Quick Sort?" required>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <script src="chatbot.js"></script>
</body>
</html>
